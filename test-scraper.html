<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CBB 2026 Scraped Data Viewer</title>
<style>
body {
  font-family: system-ui, -apple-system, sans-serif;
  margin: 0;
  padding: 20px;
  background: #f5f5f5;
}
.container {
  max-width: 1400px;
  margin: 0 auto;
  background: white;
  padding: 30px;
  border-radius: 12px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.1);
}
h1 {
  color: #003366;
  margin-top: 0;
}
.stats {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
  gap: 15px;
  margin: 20px 0;
}
.stat-card {
  background: #e8f4f8;
  padding: 20px;
  border-radius: 8px;
  border-left: 4px solid #0066cc;
}
.stat-card h3 {
  margin: 0 0 10px 0;
  font-size: 14px;
  color: #666;
  text-transform: uppercase;
}
.stat-card .number {
  font-size: 32px;
  font-weight: bold;
  color: #003366;
}
.team-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
  gap: 20px;
  margin-top: 30px;
}
.team-card {
  background: white;
  border: 1px solid #ddd;
  border-radius: 8px;
  padding: 15px;
}
.team-card h3 {
  margin: 0 0 10px 0;
  color: #003366;
}
.team-stats {
  display: flex;
  gap: 20px;
  margin: 10px 0;
  font-size: 14px;
  color: #666;
}
.pitcher-list {
  margin-top: 10px;
  font-size: 13px;
}
.pitcher {
  padding: 5px 0;
  border-bottom: 1px solid #eee;
}
.loading {
  text-align: center;
  padding: 40px;
  color: #666;
}
</style>
</head>
<body>

<div class="container">
  <h1>⚾ College Baseball 2026 - Scraped Data Viewer</h1>
  
  <div id="loading" class="loading">Loading scraped data...</div>
  
  <div id="stats" class="stats" style="display:none;"></div>
  
  <div id="teams" class="team-grid"></div>
</div>

<script>
async function loadData() {
  try {
    // Load all scraped data files
    const [rostersRes, pitchersRes, schedulesRes] = await Promise.all([
      fetch('/data/rosters_2026.json'),
      fetch('/data/pitchers_2026.json'),
      fetch('/data/schedules_2026.json')
    ]);
    
    const rosters = await rostersRes.json();
    const pitchers = await pitchersRes.json();
    const schedules = await schedulesRes.json();
    
    // Calculate totals
    const totalTeams = rosters.length;
    const totalPitchers = rosters.reduce((sum, r) => sum + (r.pitchers?.length || 0), 0);
    const totalGames = schedules.reduce((sum, s) => sum + (s.games?.length || 0), 0);
    const totalPlayers = rosters.reduce((sum, r) => sum + (r.totalPlayers || 0), 0);
    
    // Hide loading
    document.getElementById('loading').style.display = 'none';
    
    // Show stats
    const statsDiv = document.getElementById('stats');
    statsDiv.style.display = 'grid';
    statsDiv.innerHTML = `
      <div class="stat-card">
        <h3>SEC Teams</h3>
        <div class="number">${totalTeams}</div>
      </div>
      <div class="stat-card">
        <h3>Total Pitchers</h3>
        <div class="number">${totalPitchers}</div>
      </div>
      <div class="stat-card">
        <h3>Total Players</h3>
        <div class="number">${totalPlayers}</div>
      </div>
      <div class="stat-card">
        <h3>Total Games</h3>
        <div class="number">${totalGames}</div>
      </div>
    `;
    
    // Show team cards
    const teamsDiv = document.getElementById('teams');
    teamsDiv.innerHTML = rosters.map(roster => {
      const schedule = schedules.find(s => s.teamId === roster.teamId);
      const teamPitchers = pitchers[roster.teamId];
      
      return `
        <div class="team-card">
          <h3>${roster.team}</h3>
          <div class="team-stats">
            <div><strong>${roster.totalPlayers || 0}</strong> players</div>
            <div><strong>${roster.pitchers?.length || 0}</strong> pitchers</div>
            <div><strong>${schedule?.games?.length || 0}</strong> games</div>
          </div>
          ${roster.pitchers && roster.pitchers.length > 0 ? `
            <div class="pitcher-list">
              <strong>Pitchers:</strong>
              ${roster.pitchers.slice(0, 5).map(p => 
                `<div class="pitcher">#${p.number || '?'} ${p.name} - ${p.position} - ${p.year || ''}</div>`
              ).join('')}
              ${roster.pitchers.length > 5 ? `<div style="padding:5px 0; color:#666;">...and ${roster.pitchers.length - 5} more</div>` : ''}
            </div>
          ` : ''}
        </div>
      `;
    }).join('');
    
  } catch (error) {
    document.getElementById('loading').innerHTML = `
      <div style="color:red;">
        <h3>Error loading data</h3>
        <pre>${error.message}</pre>
      </div>
    `;
  }
}

// Load data when page loads
loadData();
</script>
</body>
</html>
