<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>CBB Pitcher Rosters</title>
<meta name="viewport" content="width=device-width,initial-scale=1" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@400;600;700&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  /* Modern Premium Sports Analytics Theme */
  :root{
    --cream: #fafaf8;
    --white: #ffffff;
    --slate-50: #f8fafc;
    --slate-100: #f1f5f9;
    --slate-200: #e2e8f0;
    --slate-300: #cbd5e1;
    --slate-600: #475569;
    --slate-700: #334155;
    --slate-800: #1e293b;
    --slate-900: #0f172a;
    --emerald: #10b981;
    --emerald-dark: #059669;
    --emerald-light: #d1fae5;
    --amber: #f59e0b;
    --amber-light: #fef3c7;
    --blue: #3b82f6;
    --purple: #8b5cf6;
  }

  *{box-sizing:border-box}

  html,body{
    height:100%;
    margin:0;
    padding:0;
  }

  body{
    background: linear-gradient(135deg, var(--cream) 0%, var(--slate-50) 100%);
    color: var(--slate-900);
    font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif;
    font-size: 15px;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }

  /* Top Navigation */
  #top-bar{
    background: rgba(255,255,255,.95);
    backdrop-filter: blur(20px);
    border-bottom: 1px solid var(--slate-200);
    padding: 1.25rem 2rem;
    position: sticky;
    top: 0;
    z-index: 100;
    display: flex;
    align-items: center;
    gap: 1rem;
    flex-wrap: wrap;
    box-shadow: 0 1px 3px rgba(15,23,42,.05);
  }

  #top-bar h1{
    margin: 0;
    font-family: 'Crimson Pro', serif;
    font-size: 1.75rem;
    font-weight: 700;
    color: var(--slate-900);
    letter-spacing: -0.02em;
    flex: 1;
    min-width: 200px;
  }

  #top-bar input,
  #top-bar select{
    background: var(--white);
    border: 1.5px solid var(--slate-300);
    border-radius: 10px;
    padding: 0.65rem 1rem;
    font-family: 'DM Sans', sans-serif;
    font-size: 0.9rem;
    color: var(--slate-700);
    transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    outline: none;
  }

  #top-bar input:focus,
  #top-bar select:focus{
    border-color: var(--emerald);
    box-shadow: 0 0 0 3px var(--emerald-light);
  }

  #top-bar input::placeholder{
    color: var(--slate-600);
  }

  #top-bar a{
    background: linear-gradient(135deg, var(--emerald) 0%, var(--emerald-dark) 100%);
    color: white;
    text-decoration: none;
    padding: 0.65rem 1.25rem;
    border-radius: 10px;
    font-weight: 600;
    font-size: 0.9rem;
    transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    box-shadow: 0 2px 4px rgba(16,185,129,.2);
  }

  #top-bar a:hover{
    transform: translateY(-1px);
    box-shadow: 0 4px 12px rgba(16,185,129,.3);
  }

  /* Counters */
  #counters{
    padding: 1rem 2rem;
    display: flex;
    gap: 0.75rem;
    flex-wrap: wrap;
  }

  .badge{
    background: var(--white);
    color: var(--slate-700);
    padding: 0.5rem 1rem;
    border-radius: 999px;
    font-size: 0.875rem;
    font-weight: 600;
    border: 1px solid var(--slate-200);
    box-shadow: 0 1px 2px rgba(15,23,42,.05);
  }

  /* Teams Grid */
  #teams-wrap{
    padding: 1rem 2rem 3rem 2rem;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
    gap: 1.5rem;
    animation: fadeIn 0.6s ease;
  }

  @keyframes fadeIn{
    from{opacity:0;transform:translateY(20px)}
    to{opacity:1;transform:translateY(0)}
  }

  .team-card{
    background: var(--white);
    border-radius: 20px;
    overflow: hidden;
    cursor: pointer;
    transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    border: 1px solid var(--slate-200);
    box-shadow: 0 2px 8px rgba(15,23,42,.04);
    position: relative;
  }

  .team-card::before{
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 4px;
    background: linear-gradient(90deg, var(--emerald) 0%, var(--emerald-dark) 100%);
    opacity: 0;
    transition: opacity 0.3s ease;
  }

  .team-card:hover{
    transform: translateY(-6px);
    box-shadow: 0 12px 24px rgba(15,23,42,.1);
    border-color: var(--slate-300);
  }

  .team-card:hover::before{
    opacity: 1;
  }

  .team-card.favorited{
    border-color: var(--amber);
    box-shadow: 0 4px 16px rgba(245,158,11,.15);
  }

  .team-card.favorited::before{
    background: linear-gradient(90deg, var(--amber) 0%, #f97316 100%);
    opacity: 1;
  }

  .team-header{
    padding: 2rem 1.5rem;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    gap: 1rem;
    background: linear-gradient(180deg, var(--slate-50) 0%, var(--white) 100%);
    position: relative;
  }

  .team-logo-big{
    width: 120px;
    height: 120px;
    object-fit: contain;
    filter: drop-shadow(0 2px 8px rgba(15,23,42,.08));
    transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  }

  .team-card:hover .team-logo-big{
    transform: scale(1.05);
  }

  .team-name{
    font-family: 'Crimson Pro', serif;
    font-size: 1.375rem;
    font-weight: 700;
    color: var(--slate-900);
    letter-spacing: -0.01em;
    margin-top: 0.25rem;
  }

  .team-conf{
    font-size: 0.875rem;
    color: var(--slate-600);
    font-weight: 500;
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }

  .pitcher-count{
    background: var(--emerald-light);
    color: var(--emerald-dark);
    padding: 0.375rem 0.875rem;
    border-radius: 999px;
    font-size: 0.8125rem;
    font-weight: 700;
    letter-spacing: 0.02em;
  }

  .team-star{
    position: absolute;
    top: 0.75rem;
    right: 0.75rem;
    cursor: pointer;
    font-size: 1.35rem;
    line-height: 1;
    width: 2rem;
    height: 2rem;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 50%;
    background: rgba(255,255,255,0.85);
    border: 1px solid var(--slate-200);
    box-shadow: 0 1px 4px rgba(15,23,42,.08);
    transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    user-select: none;
    z-index: 2;
  }

  .team-star:hover{
    transform: scale(1.15);
    background: var(--white);
    box-shadow: 0 2px 8px rgba(15,23,42,.12);
  }

  .team-star.active{
    background: #fef3c7;
    border-color: var(--amber);
    box-shadow: 0 2px 8px rgba(245,158,11,.3);
  }

  /* Modal Overlay */
  .modal-overlay{
    position: fixed;
    inset: 0;
    background: rgba(15,23,42,.6);
    backdrop-filter: blur(12px);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 1000;
    padding: 2rem;
    animation: fadeIn 0.25s ease;
  }

  .modal-overlay.open{
    display: flex;
  }

  .modal{
    background: var(--white);
    border-radius: 24px;
    max-width: 1400px;
    width: 100%;
    max-height: 88vh;
    overflow: hidden;
    box-shadow: 0 24px 48px rgba(15,23,42,.2);
    animation: slideUp 0.4s cubic-bezier(0.4, 0, 0.2, 1);
  }

  @keyframes slideUp{
    from{transform:translateY(40px) scale(0.96);opacity:0}
    to{transform:translateY(0) scale(1);opacity:1}
  }

  .modal-header{
    padding: 2rem 2.5rem;
    background: linear-gradient(135deg, var(--slate-50) 0%, var(--white) 100%);
    border-bottom: 1px solid var(--slate-200);
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    z-index: 10;
  }

  .modal-team-info{
    display: flex;
    align-items: center;
    gap: 1.5rem;
  }

  .modal-team-logo{
    width: 80px;
    height: 80px;
    object-fit: contain;
    filter: drop-shadow(0 2px 8px rgba(15,23,42,.08));
  }

  .modal-team-name{
    font-family: 'Crimson Pro', serif;
    font-size: 2rem;
    font-weight: 700;
    color: var(--slate-900);
    letter-spacing: -0.02em;
    margin-bottom: 0.25rem;
  }

  .modal-team-conf{
    font-size: 0.9375rem;
    color: var(--slate-600);
    font-weight: 500;
  }

  .modal-close{
    background: var(--slate-100);
    border: none;
    color: var(--slate-700);
    width: 44px;
    height: 44px;
    border-radius: 50%;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.5rem;
    font-weight: 300;
    transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
  }

  .modal-close:hover{
    background: var(--slate-200);
    transform: rotate(90deg);
  }

  .modal-body{
    padding: 2.5rem;
    overflow-y: auto;
    max-height: calc(88vh - 140px);
  }

  /* Pitchers Grid */
  .pitchers-grid{
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 2rem;
  }

  .modal-pitcher-card{
    background: var(--slate-50);
    border-radius: 20px;
    padding: 2rem 1.5rem;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    position: relative;
    transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    border: 2px solid transparent;
  }

  .modal-pitcher-card:hover{
    background: var(--white);
    transform: translateY(-4px);
    box-shadow: 0 8px 24px rgba(15,23,42,.08);
    border-color: var(--slate-200);
  }

  .modal-pitcher-card.favorited{
    background: var(--amber-light);
    border-color: var(--amber);
  }

  .modal-headshot-wrap{
    width: 180px;
    height: 180px;
    border-radius: 50%;
    overflow: hidden;
    margin-bottom: 1.25rem;
    cursor: pointer;
    position: relative;
    background: var(--white);
    border: 3px solid var(--slate-200);
    transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    box-shadow: 0 4px 12px rgba(15,23,42,.06);
  }

  .modal-headshot-wrap::before{
    content: '';
    position: absolute;
    inset: -3px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--emerald) 0%, var(--emerald-dark) 100%);
    opacity: 0;
    transition: opacity 0.3s ease;
    z-index: -1;
  }

  .modal-headshot-wrap:hover::before{
    opacity: 1;
  }

  .modal-headshot-wrap:hover{
    transform: scale(1.08);
    border-color: transparent;
    box-shadow: 0 8px 24px rgba(16,185,129,.2);
  }

  .modal-headshot{
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  .modal-pitcher-star{
    position: absolute;
    top: 1rem;
    right: 1rem;
    font-size: 1.75rem;
    cursor: pointer;
    transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    user-select: none;
    filter: drop-shadow(0 2px 4px rgba(15,23,42,.15));
    z-index: 10;
  }

  .modal-pitcher-star:hover{
    transform: scale(1.2) rotate(12deg);
  }

  .modal-pitcher-star.active{
    filter: drop-shadow(0 2px 8px rgba(245,158,11,.5));
  }

  .modal-pitcher-name{
    font-family: 'Crimson Pro', serif;
    font-size: 1.375rem;
    font-weight: 700;
    color: var(--slate-900);
    margin-bottom: 0.5rem;
    letter-spacing: -0.01em;
  }

  .modal-pitcher-number{
    display: inline-flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, var(--slate-800) 0%, var(--slate-900) 100%);
    color: white;
    padding: 0.375rem 0.875rem;
    border-radius: 999px;
    font-weight: 700;
    font-size: 0.875rem;
    margin-bottom: 1rem;
    letter-spacing: 0.02em;
    box-shadow: 0 2px 8px rgba(15,23,42,.15);
  }

  .modal-pitcher-info{
    display: flex;
    flex-direction: column;
    gap: 0.5rem;
    font-size: 0.875rem;
    color: var(--slate-600);
    margin-bottom: 1rem;
    width: 100%;
  }

  .modal-pitcher-info div{
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 0.5rem;
    font-weight: 500;
  }

  .modal-pitcher-badges{
    display: flex;
    gap: 0.5rem;
    flex-wrap: wrap;
    justify-content: center;
  }

  .modal-role-badge{
    background: var(--slate-200);
    color: var(--slate-700);
    padding: 0.375rem 0.75rem;
    border-radius: 8px;
    font-size: 0.75rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }

  .modal-role-starter{
    background: linear-gradient(135deg, var(--blue) 0%, #2563eb 100%);
    color: white;
    box-shadow: 0 2px 8px rgba(59,130,246,.2);
  }

  .modal-role-reliever{
    background: linear-gradient(135deg, var(--purple) 0%, #7c3aed 100%);
    color: white;
    box-shadow: 0 2px 8px rgba(139,92,246,.2);
  }

  /* Lightbox */
  .lightbox{
    position: fixed;
    inset: 0;
    background: rgba(15,23,42,.95);
    backdrop-filter: blur(12px);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 2000;
    padding: 3rem;
    animation: fadeIn 0.2s ease;
  }

  .lightbox.open{
    display: flex;
  }

  .lightbox img{
    max-width: 90%;
    max-height: 85vh;
    object-fit: contain;
    border-radius: 16px;
    box-shadow: 0 24px 64px rgba(0,0,0,.5);
  }

  .lightbox-close{
    position: absolute;
    top: 2rem;
    right: 2rem;
    background: var(--white);
    color: var(--slate-900);
    width: 50px;
    height: 50px;
    border-radius: 50%;
    border: none;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.5rem;
    font-weight: 300;
    transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    box-shadow: 0 4px 12px rgba(0,0,0,.3);
  }

  .lightbox-close:hover{
    background: var(--amber);
    transform: rotate(90deg);
  }

  /* Toast */
  #toast{
    position: fixed;
    bottom: 2rem;
    left: 50%;
    transform: translateX(-50%);
    background: var(--slate-900);
    color: white;
    padding: 0.875rem 1.5rem;
    border-radius: 12px;
    font-weight: 600;
    font-size: 0.9375rem;
    opacity: 0;
    transition: opacity 0.2s ease;
    pointer-events: none;
    z-index: 3000;
    box-shadow: 0 8px 24px rgba(15,23,42,.3);
  }

  #toast.show{
    opacity: 1;
  }

  /* Responsive */
  @media (max-width: 900px){
    #top-bar{
      padding: 1rem 1.5rem;
    }

    #top-bar h1{
      font-size: 1.5rem;
    }

    #counters{
      padding: 0.75rem 1.5rem;
    }

    #teams-wrap{
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      padding: 1rem 1.5rem 2rem 1.5rem;
      gap: 1.25rem;
    }

    .pitchers-grid{
      grid-template-columns: 1fr;
      gap: 1.5rem;
    }

    .modal{
      max-width: 100%;
      margin: 0;
      border-radius: 24px 24px 0 0;
    }

    .modal-header{
      padding: 1.5rem;
    }

    .modal-body{
      padding: 1.5rem;
    }

    .modal-team-name{
      font-size: 1.5rem;
    }
  }
</style>
</head>
<body>

<div id="top-bar">
  <h1>⚾ CBB Pitcher Rosters</h1>
  <input type="text" id="search" placeholder="Search teams or pitchers..." />
  <select id="divFilter">
    <option value="">All Divisions</option>
  </select>
  <select id="sortBy">
    <option value="team">Team Name</option>
    <option value="division">Division</option>
    <option value="favorites">Favorites First</option>
  </select>
  <a href="schedule.html">→ Schedule</a>
</div>

<div id="counters"></div>
<div id="teams-wrap"></div>
<div id="toast">Saved</div>

<!-- Team Roster Modal -->
<div class="modal-overlay" id="rosterModal">
  <div class="modal">
    <div class="modal-header">
      <div class="modal-team-info">
        <img class="modal-team-logo" id="modalTeamLogo" src="" alt="">
        <div>
          <div class="modal-team-name" id="modalTeamName"></div>
          <div class="modal-team-conf" id="modalTeamConf"></div>
        </div>
      </div>
      <button class="modal-close" onclick="closeRosterModal()">&times;</button>
    </div>
    <div class="modal-body">
      <div class="pitchers-grid" id="modalPitchersGrid"></div>
    </div>
  </div>
</div>

<!-- Image Lightbox -->
<div class="lightbox" id="lightbox" onclick="closeLightbox()">
  <button class="lightbox-close" onclick="closeLightbox();event.stopPropagation()">&times;</button>
  <img id="lightboxImg" src="" alt="">
</div>

<script>
const $ = s => document.querySelector(s);
const $$ = s => Array.from(document.querySelectorAll(s));

// Supabase config
const SUPABASE_URL = 'https://dtnozcqkuzhjmjvsfjqk.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImR0bm96Y3FrdXpoam1qdnNmanFrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjQ5MDY4MzAsImV4cCI6MjA4MDQ4MjgzMH0.7puo2RCr6VMNNp_lywpAqufLEGnnE3TYqAtX8zQ0X8c';
const TRACKER = 'cbb';

let TEAMS = null;
let PITCHERS = null;
let DIV_MAP = null;
let FAVORITES = { pitchers: [], teams: [], games: [] };

const teamsById = {};
const pitchersById = {};

// Toast notification
const toast = (m='Saved') => {
  const t = $("#toast");
  t.textContent = m;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 1100);
};

// Fetch JSON
async function getJSON(path){
  const r = await fetch(path, {cache: 'no-store'});
  if(!r.ok) throw new Error('HTTP '+r.status+' '+path);
  return r.json();
}

// Save favorites to Supabase
async function saveFavorites(){
  try {
    const body = {
      tracker: TRACKER,
      user_id: 'default',
      pitchers: FAVORITES.pitchers,
      teams: FAVORITES.teams,
      games: FAVORITES.games,
      updated_at: new Date().toISOString()
    };
    await fetch(`${SUPABASE_URL}/rest/v1/favorites?on_conflict=tracker,user_id`, {
      method: 'POST',
      headers: {
        'apikey': SUPABASE_KEY,
        'Authorization': `Bearer ${SUPABASE_KEY}`,
        'Content-Type': 'application/json',
        'Prefer': 'resolution=merge-duplicates'
      },
      body: JSON.stringify(body)
    });
    toast('Favorites saved');
  } catch(e) {
    console.error('Failed to save favorites:', e);
    toast('Save failed');
  }
}

// Load favorites from Supabase
async function loadFavorites(){
  try {
    const res = await fetch(`${SUPABASE_URL}/rest/v1/favorites?tracker=eq.${TRACKER}&user_id=eq.default`, {
      headers: {
        'apikey': SUPABASE_KEY,
        'Authorization': `Bearer ${SUPABASE_KEY}`
      }
    });
    const data = await res.json();
    if (data.length > 0) {
      FAVORITES.pitchers = data[0].pitchers || [];
      FAVORITES.teams = data[0].teams || [];
      FAVORITES.games = data[0].games || [];
    }
  } catch(e) {
    console.error('Failed to load favorites:', e);
  }
}

// Toggle pitcher favorite
function toggleFavorite(pitcherId){
  const idx = FAVORITES.pitchers.indexOf(pitcherId);
  if(idx > -1){
    FAVORITES.pitchers.splice(idx, 1);
  } else {
    FAVORITES.pitchers.push(pitcherId);
  }
  saveFavorites();
  render();
}

// Toggle team favorite
function toggleTeamFavorite(teamId){
  const idx = FAVORITES.teams.indexOf(teamId);
  if(idx > -1){
    FAVORITES.teams.splice(idx, 1);
  } else {
    FAVORITES.teams.push(teamId);
  }
  saveFavorites();
  render();
}

// Check if pitcher is favorited
function isFavorited(pitcherId){
  return FAVORITES.pitchers.includes(pitcherId);
}

// Check if team is favorited
function isTeamFavorited(teamId){
  return FAVORITES.teams.includes(teamId);
}

// Get team data
function getTeam(tid){
  return teamsById[String(tid)] || {};
}

// Get team logo
function getTeamLogo(tid){
  const team = getTeam(tid);
  return team.logo || '';
}

// Filter teams
function filterTeams(teams){
  const search = ($("#search")?.value || '').toLowerCase();
  const div = $("#divFilter")?.value || '';

  return teams.filter(t => {
    if(div && teamDiv(t.team_id) !== div) return false;

    if(search){
      const teamName = (t.team || t.displayName || '').toLowerCase();
      const pitcherNames = (t.pitchers || []).map(p =>
        (p.name || p.displayName || '').toLowerCase()
      ).join(' ');
      if(!teamName.includes(search) && !pitcherNames.includes(search)) return false;
    }

    return true;
  });
}

// Sort teams
function sortTeams(teams){
  const sortBy = $("#sortBy")?.value || 'team';
  return teams.slice().sort((a,b) => {
    if(sortBy === 'division'){
      const aDiv = teamDiv(a.team_id);
      const bDiv = teamDiv(b.team_id);
      if(aDiv !== bDiv) return aDiv.localeCompare(bDiv);
    }
    if(sortBy === 'favorites'){
      const aFav = isTeamFavorited(a.team_id) || (a.pitchers || []).some(p => isFavorited(p.id));
      const bFav = isTeamFavorited(b.team_id) || (b.pitchers || []).some(p => isFavorited(p.id));
      if(aFav !== bFav) return bFav ? 1 : -1;
    }
    const aName = a.team || a.displayName || '';
    const bName = b.team || b.displayName || '';
    return aName.localeCompare(bName);
  });
}

// Get team division
function teamDiv(tid){
  return DIV_MAP?.[String(tid)] || 'Unknown';
}

// Get pitcher handedness from position
function getPitcherRole(pitcher){
  return pitcher.position || pitcher.role || 'Pitcher';
}

// Render teams
function render(){
  const wrap = $("#teams-wrap");
  if(!wrap) return;

  if(!PITCHERS || !PITCHERS.teams){
    wrap.innerHTML = '<div style="padding:2rem;text-align:center;color:var(--slate-600)">Loading rosters...</div>';
    return;
  }

  const filtered = filterTeams(PITCHERS.teams);
  const sorted = sortTeams(filtered);

  wrap.innerHTML = '';

  for(const team of sorted){
    const tid = String(team.teamId || team.team_id || '');
    const card = document.createElement('div');
    card.className = 'team-card' + (isTeamFavorited(tid) ? ' favorited' : '');

    // Click handler to open modal
    card.onclick = (e) => {
      if(e.target.closest('.team-star') || e.target.closest('a')) return;
      openRosterModal(team);
    };

    const header = document.createElement('div');
    header.className = 'team-header';

    const teamLogo = team.logo || getTeamLogo(tid);
    const logo = teamLogo ?
      `<img class="team-logo-big" src="${teamLogo}" alt="${team.team || team.displayName}">` :
      `<div style="width:120px;height:120px;border-radius:16px;background:var(--slate-200);color:var(--slate-600);font-weight:800;display:flex;align-items:center;justify-content:center;font-size:2.5rem;font-family:'Crimson Pro',serif">${team.team_abbr || 'CBB'}</div>`;

    const favCount = (team.pitchers || []).filter(p => isFavorited(p.id)).length;
    const divisionName = team.conference || teamDiv(tid);

    const teamStar = document.createElement('span');
    teamStar.className = 'team-star' + (isTeamFavorited(tid) ? ' active' : '');
    teamStar.textContent = isTeamFavorited(tid) ? '⭐' : '☆';
    teamStar.title = 'Favorite this team';
    teamStar.onclick = (e) => {
      e.stopPropagation();
      toggleTeamFavorite(tid);
    };

    header.innerHTML = `
      ${logo}
      <div class="team-name">${team.team || team.displayName}</div>
      <div class="team-conf">${divisionName}</div>
      <div style="display:flex;gap:.5rem;align-items:center;justify-content:center;margin-top:.5rem">
        <span class="pitcher-count">${(team.pitchers || []).length} Pitchers</span>
        ${favCount > 0 ? `<span class="pitcher-count" style="background:var(--amber-light);color:#d97706">${favCount} ⭐</span>` : ''}
      </div>
    `;
    header.appendChild(teamStar);

    card.appendChild(header);
    wrap.appendChild(card);
  }

  updateCounters(sorted);
}

// Open roster modal
function openRosterModal(team){
  const modal = $('#rosterModal');
  const teamLogo = $('#modalTeamLogo');
  const teamName = $('#modalTeamName');
  const teamConf = $('#modalTeamConf');
  const grid = $('#modalPitchersGrid');

  if(!modal || !teamLogo || !teamName || !teamConf || !grid) return;

  // Set team info
  teamLogo.src = team.logo || getTeamLogo(team.team_id) || '';
  teamName.textContent = team.team || team.displayName || '';
  teamConf.textContent = `${team.conference || teamDiv(team.team_id)} • ${(team.pitchers || []).length} Pitchers`;

  // Build pitchers grid
  grid.innerHTML = '';

  const pitchers = (team.pitchers || []).slice().sort((a,b) => {
    return (a.lastName || a.name || '').localeCompare(b.lastName || b.name || '');
  });

  for(const pitcher of pitchers){
    const card = document.createElement('div');
    card.className = 'modal-pitcher-card' + (isFavorited(pitcher.id) ? ' favorited' : '');

    const team_logo_url = team.logo || getTeamLogo(team.team_id) || '';

    const headshotUrl = pitcher.headshot || team_logo_url;
    const headshot = headshotUrl ?
      `<img class="modal-headshot" src="${headshotUrl}" alt="${pitcher.name}" onerror="this.src='${team_logo_url}'">` :
      `<div style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-weight:700;color:var(--slate-500);font-size:3rem;font-family:'Crimson Pro',serif;background:var(--slate-100)">${(pitcher.firstName || pitcher.name?.split(' ')[0] || '')[0] || 'P'}</div>`;

    const star = document.createElement('span');
    star.className = 'modal-pitcher-star' + (isFavorited(pitcher.id) ? ' active' : '');
    star.textContent = isFavorited(pitcher.id) ? '★' : '☆';
    star.onclick = (e) => {
      e.stopPropagation();
      toggleFavorite(pitcher.id);
    };

    const role = getPitcherRole(pitcher);
    let roleBadge = `<span class="modal-role-badge">${role}</span>`;
    if(role.includes('Starter')) roleBadge = `<span class="modal-role-badge modal-role-starter">STARTER</span>`;
    if(role.includes('Reliever')) roleBadge = `<span class="modal-role-badge modal-role-reliever">RELIEVER</span>`;

    const headshotWrap = document.createElement('div');
    headshotWrap.className = 'modal-headshot-wrap';
    headshotWrap.innerHTML = headshot;
    headshotWrap.onclick = () => openLightbox(headshotUrl);

    card.innerHTML = `
      <div class="modal-pitcher-name">${pitcher.name || pitcher.displayName}</div>
      <div class="modal-pitcher-number">#${pitcher.number || '–'}</div>
      <div class="modal-pitcher-info">
        ${pitcher.height || pitcher.weight ? `<div>📏 ${pitcher.height || ''} ${pitcher.weight || ''}</div>` : ''}
        ${pitcher.year ? `<div>🎓 ${pitcher.year}</div>` : ''}
        ${pitcher.hometown ? `<div>📍 ${pitcher.hometown}</div>` : ''}
      </div>
      <div class="modal-pitcher-badges">
        ${roleBadge}
      </div>
    `;

    card.insertBefore(headshotWrap, card.firstChild);
    card.insertBefore(star, card.firstChild);

    grid.appendChild(card);
  }

  modal.classList.add('open');
  document.body.style.overflow = 'hidden';
}

// Close roster modal
function closeRosterModal(){
  const modal = $('#rosterModal');
  if(modal){
    modal.classList.remove('open');
    document.body.style.overflow = '';
  }
}

// Open lightbox
function openLightbox(imageUrl){
  const lightbox = $('#lightbox');
  const img = $('#lightboxImg');
  if(!lightbox || !img || !imageUrl) return;

  img.src = imageUrl;
  lightbox.classList.add('open');
}

// Close lightbox
function closeLightbox(){
  const lightbox = $('#lightbox');
  if(lightbox){
    lightbox.classList.remove('open');
  }
}

// Update counters
function updateCounters(teams){
  const counters = $("#counters");
  if(!counters) return;

  const totalPitchers = teams.reduce((sum, t) => sum + (t.pitchers || []).length, 0);
  const favPitchers = FAVORITES.pitchers.length;
  const favTeams = FAVORITES.teams.length;

  counters.innerHTML = `
    <span class="badge">Teams: ${teams.length}</span>
    <span class="badge">Pitchers: ${totalPitchers}</span>
    <span class="badge">⭐ Favorite Teams: ${favTeams}</span>
    <span class="badge">⭐ Favorite Pitchers: ${favPitchers}</span>
  `;
}

// Populate division dropdown
function populateDivisionDropdown(){
  const sel = $("#divFilter");
  if(!sel || !DIV_MAP) return;

  const divs = new Set(Object.values(DIV_MAP).filter(d => d && d !== 'Unknown'));
  const sorted = Array.from(divs).sort();

  for(const div of sorted){
    const opt = document.createElement('option');
    opt.value = div;
    opt.textContent = div;
    sel.appendChild(opt);
  }
}

// Keyboard shortcuts
document.addEventListener('keydown', (e) => {
  if(e.key === 'Escape'){
    closeRosterModal();
    closeLightbox();
  }
});

// Boot
async function boot(){
  await loadFavorites();

  TEAMS = await getJSON('./data/teams.json');
  PITCHERS = await getJSON('./data/pitchers.json');
  DIV_MAP = await getJSON('./data/divisions_map.json');

  if(PITCHERS && typeof PITCHERS === 'object'){
    if(PITCHERS.teams && Array.isArray(PITCHERS.teams)){
      // Already in correct format
    }
    else if(!Array.isArray(PITCHERS)){
      const teamsArray = Object.values(PITCHERS).filter(t => t && t.pitchers);
      PITCHERS = { teams: teamsArray };
    }
  }

  if(TEAMS && TEAMS.teams){
    for(const t of TEAMS.teams){
      const tid = String(t.id || t.team_id || '');
      if(tid) teamsById[tid] = t;
    }
  }

  if(PITCHERS && PITCHERS.teams && TEAMS && TEAMS.teams){
    for(const pTeam of PITCHERS.teams){
      const pitcherTeamId = String(pTeam.teamId || pTeam.team_id || '');
      const matchedTeam = TEAMS.teams.find(t => String(t.id) === pitcherTeamId);

      if(matchedTeam){
        pTeam.logo = matchedTeam.logo;
        pTeam.conference = matchedTeam.conference;
        pTeam.espn_team_id = matchedTeam.id;
      }
    }
  }

  if(PITCHERS && PITCHERS.teams){
    for(const t of PITCHERS.teams){
      const tid = String(t.team_id || t.id || '');
      if(tid) pitchersById[tid] = t;
    }
  }

  populateDivisionDropdown();
  render();

  console.log('⚾ Roster page loaded!');
  console.log('Teams:', PITCHERS?.teams?.length || 0);
  console.log('Total Pitchers:', PITCHERS?.totalPitchers || 0);
  console.log('Divisions loaded:', Object.keys(DIV_MAP || {}).length);
  console.log('Favorite Teams:', FAVORITES.teams.length);
  console.log('Favorite Pitchers:', FAVORITES.pitchers.length);
}

// Event listeners
$("#search")?.addEventListener('input', render);
$("#divFilter")?.addEventListener('change', render);
$("#sortBy")?.addEventListener('change', render);

document.addEventListener('DOMContentLoaded', boot);
</script>
</body>
